<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NETRAGE TikTok sign-in</title>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 16px;color:#141826;background:#f6f7fb}code{display:block;word-break:break-all;background:#fff;border:1px solid #d3d8e4;padding:12px;border-radius:8px;font-size:15px}button{margin-top:10px;padding:8px 14px;border-radius:999px;border:1px solid #e8642c;background:#e8642c;color:#fff;font-weight:600}</style></head>
<body><h1>TikTok sign-in</h1><p id="msg">Copy this code and send it to the NETRAGE bot in Telegram.</p><code id="code">-</code><button id="copy" type="button">Copy code</button>
<script>
const q=new URLSearchParams(location.search);const c=q.get("code");const e=q.get("error");
document.getElementById("code").textContent=c||("No code: "+(e||"missing")+" "+(q.get("error_description")||""));
if(!c)document.getElementById("msg").textContent="TikTok didn't send a code. Go back and approve the sign-in again.";
document.getElementById("copy").onclick=()=>navigator.clipboard.writeText(c||"").then(()=>document.getElementById("copy").textContent="Copied");
</script></body></html>
